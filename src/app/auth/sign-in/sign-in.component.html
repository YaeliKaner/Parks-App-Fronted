<div class="auth-container">
  <div class="auth-card">
    <h2 class="auth-title">התחברות</h2>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Email:</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          id="email"
          required
          placeholder="example@mail.com"
        />
      </div>

      <div class="form-group">
        <label for="password">:סיסמא</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          id="password"
          required
          placeholder="••••••••"
        />
      </div>

      <div class="actions">
        <button type="submit" class="submit-button">כניסה</button>
      </div>
    </form>

    <div class="additional-links">
      <button routerLink="/sign-up" class="subtle-link">
        don't have an account? sign up
      </button>
    </div>

    <div *ngIf="errorMsg" class="error-message">
      {{ errorMsg }}
    </div>
  </div>
</div>
